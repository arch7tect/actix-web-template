apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos-app
  namespace: memos
  labels:
    app: memos-app
    app.kubernetes.io/part-of: memos
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memos-app
  template:
    metadata:
      labels:
        app: memos-app
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: memos-app
          image: memos-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3737
          envFrom:
            - configMapRef:
                name: memos-config
            - secretRef:
                name: memos-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3737
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3737
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
