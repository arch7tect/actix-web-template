apiVersion: v1
kind: ConfigMap
metadata:
  name: memos-config
  namespace: memos
  labels:
    app.kubernetes.io/part-of: memos
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "3737"
  RUST_LOG: "info"
  LOG_FORMAT: "json"
  APP_ENV: "production"
  TRUST_PROXY: "true"
  HSTS_ENABLED: "false"
  FRAME_OPTIONS: "DENY"
  DATABASE_MAX_CONNECTIONS: "10"
  DATABASE_CONNECT_TIMEOUT: "30"
  DATABASE_MIN_CONNECTIONS: "2"
  DATABASE_IDLE_TIMEOUT: "300"
  DATABASE_MAX_LIFETIME: "1800"
  CORS_ALLOWED_ORIGINS: "*"
  MAX_REQUEST_SIZE: "262144"
  ENABLE_SWAGGER: "true"
